name: App Users Pytest

on:
  push:
    branches:
      -dev
      -main
  pull_request:
    branches:
      -dev
      -main

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Get code in
      uses: actions/checkout@v7
    - name: Get action setup
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Install Pytest
      run: pip install --no-cache-dir pytest
    - name: Run pytest
      run: pytest